<div class="contact-container">
  <div class="hero">
    <h1><i class="fas fa-envelope"></i> Contact</h1>
  </div>

  <div class="contact-content">
    <div class="form-section">
      <h2>Get in Touch</h2>
      <form #contactForm="ngForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="name">Name *</label>
          <input
            type="text"
            id="name"
            name="name"
            [(ngModel)]="formData.name"
            required
            class="form-control"
          />
        </div>

        <div class="form-group">
          <label for="email">Email *</label>
          <input
            type="email"
            id="email"
            name="email"
            [(ngModel)]="formData.email"
            required
            class="form-control"
          />
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea
            id="message"
            name="message"
            [(ngModel)]="formData.message"
            rows="5"
            class="form-control"
          ></textarea>
        </div>

        <div class="button-group">
          <button type="submit" class="btn btn-primary" [disabled]="!contactForm.valid">
            Submit
          </button>
          <button type="button" class="btn btn-secondary" (click)="resetForm()">
            Reset
          </button>
        </div>
      </form>
    </div>

    <div class="preview-section" *ngIf="showPreview">
      <h2>Form Preview</h2>
      <div class="preview-content">
        <p><strong>Name *</strong></p>
        <p>{{ formData.name | uppercase }}</p>

        <p><strong>Email *</strong></p>
        <p>{{ formData.email }}</p>

        <p><strong>Message</strong></p>
        <p>{{ formData.message }}</p>
      </div>
    </div>
  </div>
</div>
